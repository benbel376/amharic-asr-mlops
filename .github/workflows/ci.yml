# CI for the ASR lab. Not yet run on GitHub; every step was run by hand in a Linux container
# (python:3.12-slim) on 20 Oct 2026. Inside a larger repo, GitHub only reads the top-level
# .github/workflows/: see FACILITATOR_NOTES.md, "Integrating into the workshop repo".
#
# Job 1 (every push and pull request): unit tests. Must stay green.
# Job 2 (manual "Run workflow", or a pull request labelled "evaluate"):
#   data gate, evaluation of champion and candidate, promotion rule. With the shipped candidate
#   (tiny-stage2) it ends RED on purpose: the rule rejects it (episode 4).
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (lock file; pywin32 is Windows-only, torch from the CPU index)
        run: |
          grep -v '^pywin32==' requirements.lock > /tmp/requirements-linux.lock
          uv venv --python 3.12
          uv pip install -r /tmp/requirements-linux.lock --torch-backend cpu
      - name: Unit tests (normaliser, audio gate, service contract and privacy)
        run: .venv/bin/python -m pytest -q

  gate2-evidence:
    needs: unit-tests
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'evaluate'))
    runs-on: ubuntu-latest
    env: {PYTHONPATH: src, HF_HUB_DISABLE_TELEMETRY: "1", MLFLOW_DISABLE_TELEMETRY: "true"}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          grep -v '^pywin32==' requirements.lock > /tmp/requirements-linux.lock
          uv venv --python 3.12
          uv pip install -r /tmp/requirements-linux.lock --torch-backend cpu
      - name: Cache data and models
        uses: actions/cache@v4
        with: {path: "data/raw\nmodels", key: "asr-${{ hashFiles('scripts/downloads.json') }}"}
      - name: Download (checksums verified)
        run: .venv/bin/python scripts/download.py
      - name: Data gate (every eval clip must pass the audio gate)
        run: .venv/bin/python scripts/prepare_data.py && .venv/bin/python scripts/check_data.py
      - name: Evaluate champion and candidate
        run: |
          .venv/bin/python -m asr.evaluate --model champion
          .venv/bin/python -m asr.evaluate --model candidate
      - name: Promotion rule (fails the job on REJECT)
        run: .venv/bin/python scripts/promote.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: gate2-evidence, path: "results/*.json\nresults/*_hyps.csv"}
